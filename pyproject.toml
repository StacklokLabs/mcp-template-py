[project]
name = "mcp-template-py"
version = "0.1.0"
description = "Python MCP server template."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cachetools>=6.2.6",
    "fastapi>=0.127.0",
    "mcp>=1.22.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "structlog>=25.5.0",
    "pyjwt>=2.12.0", # CVE-2026-32597
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.9",
    "ty>=0.0.1a18",
    "pytest-cov>=7.0.0",
    "pytest-httpx>=0.36.0",
]
security = [
    "bandit[toml]>=1.8.0",
    "pip-audit>=2.7.3",
    "cyclonedx-bom>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--cov=mcp_template_py --cov-report html"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
