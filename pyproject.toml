[project]
name = "mcp-template-py"
version = "0.1.0"
description = "Python MCP server template."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "mcp>=1.22.0",
    "pydantic>=2.12.4",
]

[dependency-groups]
dev = [
    "greenlet>=3.2.4",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.9",
    "ty>=0.0.1a18",
    "pytest-cov>=7.0.0",
]
security = [
    "safety>=3.2.11",
    "bandit[toml]>=1.8.0",
    "pip-audit>=2.7.3",
    "cyclonedx-bom>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
