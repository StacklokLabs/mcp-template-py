[project]
name = "mcp-template-py"
version = "0.1.0"
description = "Python MCP server template."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.7",  # CVE-2026-39892 - transitive dep via mcp->pyjwt[crypto]
    "fastapi>=0.127.0",
    "mcp>=1.22.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.2",  # CVE-2026-28684 - transitive dep via pydantic-settings
    "python-multipart>=0.0.26",  # CVE-2026-40347 - transitive dep via fastapi
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",  # CVE-2025-71176
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.9",
    "ty>=0.0.1a18",
    "pytest-cov>=7.0.0",
]
security = [
    "bandit[toml]>=1.8.0",
    "pip-audit>=2.7.3",
    "cyclonedx-bom>=6.0.0",
    "lxml>=6.1.0",  # CVE-2026-41066 - transitive dep via cyclonedx-bom
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
addopts = "--cov=mcp_template_py --cov-report html"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
