name: Lookup DHI Digest

# Temporary workflow to fetch current dhi.io image digests.
# Delete after digests are read from the run summary.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/lookup-dhi-digest.yml

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Login to dhi.io
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Inspect digests
        run: |
          set -euo pipefail
          runtime=$(docker buildx imagetools inspect dhi.io/python:3.13-alpine3.23 --format '{{.Manifest.Digest}}')
          builder=$(docker buildx imagetools inspect dhi.io/python:3.13-alpine3.23-dev --format '{{.Manifest.Digest}}')
          {
            echo "### DHI Python 3.13-alpine3.23 digests"
            echo ""
            echo "- runtime (\`3.13-alpine3.23\`): \`$runtime\`"
            echo "- builder (\`3.13-alpine3.23-dev\`): \`$builder\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "runtime=$runtime"
          echo "builder=$builder"
