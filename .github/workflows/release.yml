name: Release

# TODO: Replace the placeholder trigger below with the real one when using this template.
# Replace all occurrences of 'PLACEHOLDER' with the appropriate values.
# on:
#   push:
#     tags:
#       - 'v*'
on:
  workflow_dispatch:

jobs:
  code_checks:
    name: Code Checks
    uses: ./.github/workflows/code-checks.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  release:
    needs: code_checks
    name: Release Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to DHI registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag version
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Validate tag version
        run: |
          if [ -z "${{ steps.tag.outputs.VERSION }}" ]; then
            echo "::error::VERSION is empty. This workflow must be triggered by a tag push (e.g. v1.0.0)."
            exit 1
          fi

      - name: Set repository owner lowercase
        id: repo_owner
        run: echo "OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set image repository
        id: image_repo
        run: echo "value=ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/PLACEHOLDER" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.image_repo.outputs.value }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
          labels: |
            org.opencontainers.image.title=PLACEHOLDER
            org.opencontainers.image.description=PLACEHOLDER
            org.opencontainers.image.vendor=Stacklok
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Build and push container
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b543b06566a6925bc3a12f1a95b3 # v2.3.0
        with:
          subject-name: ${{ steps.image_repo.outputs.value }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: 'v3.0.5'

      - name: Sign container image digest
        run: |
          IMAGE_REF="${{ steps.image_repo.outputs.value }}@${{ steps.build.outputs.digest }}"
          echo "Signing image digest: $IMAGE_REF"
          cosign sign -y "$IMAGE_REF"

      - name: Verify container signature
        run: |
          IMAGE_REF="${{ steps.image_repo.outputs.value }}@${{ steps.build.outputs.digest }}"
          echo "Verifying signature for: $IMAGE_REF"
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/release\\.yml" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "$IMAGE_REF"

      - name: Verify SLSA provenance attestation
        run: |
          IMAGE_REF="${{ steps.image_repo.outputs.value }}@${{ steps.build.outputs.digest }}"
          echo "Verifying provenance attestation for: $IMAGE_REF"
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/release\\.yml" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "$IMAGE_REF"
