# Automatically creates a patch release when a PR is merged to a release/X.Y
# branch. Bumps VERSION and pyproject.toml, commits, tags, and pushes — which
# triggers release.yml.
#
# Requires a GitHub App token (secrets MCP_RELEASE_WORKFLOW_APP_ID and
# MCP_RELEASE_WORKFLOW_APP_KEY). The default GITHUB_TOKEN cannot fire
# downstream workflows on tag push — GitHub explicitly blocks that to prevent
# infinite workflow recursion.
#
# This workflow ships STUBBED so the template repo itself does not cut
# releases. To enable in your fork:
#   1. Replace the `on: workflow_dispatch` trigger below with the
#      `on: pull_request` block that is commented out.
#   2. Uncomment the `concurrency` block.
#   3. Replace `if: false` with `if: github.event.pull_request.merged == true`.
#   4. See `docs/release-playbook.md` for the full list of required secrets.

name: Patch Release

# Real trigger — uncomment when enabling releases in your fork:
# on:
#   pull_request:
#     types: [closed]
#     branches:
#       - "release/**"
on:
  workflow_dispatch:

permissions: {}

# Uncomment when enabling the real trigger above:
# concurrency:
#   group: patch-release-${{ github.event.pull_request.base.ref }}
#   cancel-in-progress: false

jobs:
  patch-release:
    # Stub guard — replace with `if: github.event.pull_request.merged == true`
    # when enabling the real trigger above.
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.MCP_RELEASE_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.MCP_RELEASE_WORKFLOW_APP_KEY }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine next patch version
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.base.ref }}"
          MINOR="${BRANCH#release/}"
          if [[ ! "$MINOR" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Branch '$BRANCH' does not match release/X.Y pattern"
            exit 1
          fi

          LATEST_PATCH=$(git tag --list "v${MINOR}.*" | grep -E "^v${MINOR}\.[0-9]+$" | sed "s/^v${MINOR}\.//" | sort -n | tail -1)
          if [[ -z "$LATEST_PATCH" ]]; then
            echo "::error::No existing tags found for v${MINOR}.* — initial releases must use the create-release workflow"
            exit 1
          fi

          NEXT_PATCH=$((LATEST_PATCH + 1))
          NEXT_VERSION="${MINOR}.${NEXT_PATCH}"
          NEXT_TAG="v${NEXT_VERSION}"

          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEXT_TAG}"         >> "$GITHUB_OUTPUT"
          echo "::notice::Next patch release: ${NEXT_TAG}"

      - name: Verify tag does not already exist
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git tag --list "$TAG" | grep -q .; then
            echo "::error::Tag $TAG already exists locally"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::Tag $TAG already exists on remote"
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump and verify version
        uses: ./.github/actions/bump-version
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Commit and tag
        run: |
          git add VERSION pyproject.toml
          git commit -m "Release ${{ steps.version.outputs.tag }}"
          git tag "${{ steps.version.outputs.tag }}"

      - name: Push commit and tag
        run: |
          git push origin "${{ github.event.pull_request.base.ref }}"
          git push origin "${{ steps.version.outputs.tag }}"
          echo "::notice::Tag ${{ steps.version.outputs.tag }} pushed — release pipeline triggered."
