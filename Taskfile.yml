version: '3'

tasks:
  install:
    desc: Install dependencies
    cmds:
      - uv sync --dev --all-packages --group security

  lint:
    desc: Run linting with ruff
    cmds:
      - uv run ruff check .
    deps:
      - install

  format:
    desc: Fix linting issues and format code
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .
    deps:
      - install

  typecheck:
    desc: Run type checking with ty
    cmds:
      - uv run ty check .
    deps:
      - install

  test:
    desc: Run unit tests with pytest
    cmds:
      - uv run pytest -v
    deps:
      - install

  check:
    desc: Run all checks (lint, typecheck, tests, and security)
    deps:
      - lint
      - typecheck
      - test
      - security

  run:
    desc: Run the MCP server locally
    cmds:
      - uv run python -m src.agent_mcp

  compose:
    desc: Docker compose up
    cmds:
      - docker-compose -f docker-compose.yml --env-file .env up --build -d
