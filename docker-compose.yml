services:
  mcp-template-py:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-template-py:dev
    ports:
      - "${MCP_PORT:-8100}:8100"
    environment:
      MCP_PORT: 8100
      DEBUG: ${DEBUG:-false}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_EXTERNAL_AUTH_URL: ${OAUTH_EXTERNAL_AUTH_URL:-}
      OAUTH_EXTERNAL_TOKEN_URL: ${OAUTH_EXTERNAL_TOKEN_URL:-}
      OAUTH_EXTERNAL_SCOPES: ${OAUTH_EXTERNAL_SCOPES:-}
    restart: unless-stopped
    # Security settings for k8s compatibility
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=64M
      - /home/appuser/.cache:mode=755,uid=1000,gid=1000,size=64M
